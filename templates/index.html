<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCNA 200-301 Exam Simulator & AI Agent</title>
<style>
  :root {
    --bg: #0E161D;
    --panel: #121C24;
    --panel-alt: #16212B;
    --line: #263440;
    --text: #D7DEE3;
    --muted: #6B7885;
    --dim: #4A5966;
    --wire: #7FB2DD;
    --ready: #4FBE85;
    --building: #E0AC4E;
    --focus: #E06868;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
  }
  .frame {
    max-width: 760px;
    margin: 28px auto 80px;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    background: var(--panel);
  }
  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--panel-alt);
    border-bottom: 1px solid var(--line);
  }
  .titlebar .dots { display: flex; gap: 6px; }
  .titlebar .dot { width: 10px; height: 10px; border-radius: 50%; }
  .titlebar .dot.r { background: #E06868; }
  .titlebar .dot.y { background: #E0AC4E; }
  .titlebar .dot.g { background: #4FBE85; }
  .titlebar .path { color: var(--muted); font-size: 12px; margin-left: 4px; }

  .quota-ring-wrap { margin-left: auto; display: flex; align-items: center; gap: 7px; cursor: default; }
  .quota-ring-label { font-size: 10.5px; color: var(--muted); text-align: right; line-height: 1.3; }
  .quota-ring-label .n { color: var(--text); font-weight: 600; }
  .quota-ring svg { display: block; }
  .quota-ring circle.track { stroke: var(--line); fill: none; }
  .quota-ring circle.fill { fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.3s ease; }

  .toolbar { display: flex; gap: 8px; padding: 12px 14px; background: var(--panel-alt); border-bottom: 1px solid var(--line); flex-wrap: wrap; }

  .content { padding: 24px 24px 30px; }

  .prompt { color: var(--wire); }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--ready); margin-left: 4px; animation: blink 1s steps(1) infinite; vertical-align: -2px; }
  @keyframes blink { 50% { opacity: 0; } }

  p { line-height: 1.6; color: var(--text); margin: 8px 0; }
  .muted { color: var(--muted); }
  .dim { color: var(--dim); }

  .box { border: 1px solid var(--line); border-radius: 5px; background: var(--panel-alt); padding: 16px 18px; margin-top: 16px; }
  .section-title { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

  .field { margin-top: 16px; }
  .flag-group { display: flex; flex-wrap: wrap; gap: 8px; }
  .flag {
    border: 1px solid var(--line); background: var(--panel); color: var(--text);
    padding: 7px 12px; border-radius: 4px; font-family: var(--mono); font-size: 12.5px; cursor: pointer;
  }
  .flag.selected { border-color: var(--wire); color: var(--wire); background: rgba(127,178,221,0.08); }
  .flag.suggested { border-color: var(--building); }

  button.run-btn, button.ghost-btn, button.small-btn {
    font-family: var(--mono);
    border-radius: 5px;
    cursor: pointer;
  }
  .run-btn {
    background: var(--ready); color: #08130D; border: none; font-weight: 700; font-size: 13px; padding: 11px 18px; margin-top: 20px;
  }
  .run-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .run-btn.alt { background: var(--wire); color: #08131C; }
  .ghost-btn { background: transparent; border: 1px solid var(--line); color: var(--text); font-size: 12.5px; padding: 9px 14px; }
  .ghost-btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .small-btn { background: transparent; border: none; color: var(--wire); font-size: 12px; padding: 0; text-decoration: underline; }

  .focus-banner { border: 1px solid var(--building); background: rgba(224,172,78,0.08); border-radius: 5px; padding: 10px 14px; margin-top: 14px; font-size: 12.5px; display: flex; justify-content: space-between; align-items: center; }

  .topic-search-wrap { position: relative; margin-top: 6px; }
  .topic-search-input {
    width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--text);
    font-family: var(--mono); font-size: 12.5px; padding: 9px 12px; border-radius: 4px;
  }
  .topic-search-input:focus { outline: none; border-color: var(--wire); }
  .topic-suggestions {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 5;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    max-height: 200px; overflow-y: auto; display: none;
  }
  .topic-suggestions.open { display: block; }
  .topic-suggestion { padding: 8px 12px; font-size: 12.5px; cursor: pointer; display: flex; justify-content: space-between; }
  .topic-suggestion:hover { background: var(--panel-alt); }
  .topic-suggestion .dom { color: var(--dim); font-size: 11px; }
  .topic-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .topic-chip {
    display: flex; align-items: center; gap: 6px; background: rgba(127,178,221,0.1);
    border: 1px solid var(--wire); color: var(--wire); font-size: 12px; padding: 5px 8px 5px 10px; border-radius: 4px;
  }
  .topic-chip button { background: none; border: none; color: var(--wire); cursor: pointer; font-family: var(--mono); font-size: 13px; padding: 0; line-height: 1; }

  .q-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  .q-card { flex: 0 0 100%; min-width: 0; box-sizing: border-box; padding: 4px 2px; }
  .q-text { font-size: 19px; line-height: 1.5; margin-bottom: 22px; color: var(--text); }
  label.option {
    display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px;
    border: 1px solid var(--line); border-radius: 4px; margin-bottom: 10px; cursor: pointer; font-size: 16px;
  }
  label.option:hover { border-color: var(--wire); }
  label.option:has(input:checked) { border-color: var(--wire); background: rgba(127,178,221,0.07); }
  label.option input { accent-color: var(--wire); margin-top: 3px; }
  label.option .letter { color: var(--wire); font-weight: 700; width: 18px; flex-shrink: 0; font-size: 17px; }
  .q-card.correct { border-left: 3px solid var(--ready); padding-left: 14px; }
  .q-card.missed { border-left: 3px solid var(--focus); padding-left: 14px; }
  .explanation { display: none; margin-top: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 4px; font-size: 13.5px; background: var(--panel); }

  .exam-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
  .exam-nav .ghost-btn { flex: 0 0 auto; }
  .exam-position { font-size: 12.5px; color: var(--muted); }
  .exam-viewport { overflow: hidden; margin-top: 16px; }
  .exam-track { display: flex; transition: transform 0.25s ease; align-items: flex-start; }
  .exam-track.reviewing { display: block; transform: none !important; }
  .exam-track.reviewing .q-card { flex: none; width: 100%; margin-bottom: 22px; }

  .status-line { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-radius: 5px; margin-top: 16px; }
  .status-line.fail { background: rgba(224,104,104,0.12); border: 1px solid rgba(224,104,104,0.35); }
  .status-line.pass { background: rgba(79,190,133,0.12); border: 1px solid rgba(79,190,133,0.35); }
  .status-line .big { font-size: 16px; font-weight: 700; }
  .status-line.fail .big { color: var(--focus); }
  .status-line.pass .big { color: var(--ready); }

  .cli-row { display: flex; color: var(--text); padding: 4px 0; font-size: 12.5px; align-items: baseline; }
  .cli-id { color: var(--wire); width: 30px; flex-shrink: 0; }
  .cli-name { flex: 1; min-width: 0; }
  .cli-pct { width: 46px; text-align: right; flex-shrink: 0; }
  .cli-trend { width: 60px; text-align: right; flex-shrink: 0; }
  .cli-status { width: 90px; text-align: right; flex-shrink: 0; font-weight: 600; }
  .up { color: var(--ready); }
  .down { color: var(--focus); }
  .flat, .none { color: var(--muted); }
  .ready-txt { color: var(--ready); }
  .building-txt { color: var(--building); }
  .focus-txt { color: var(--focus); }

  .missed-item { border-top: 1px solid var(--line); padding: 10px 0; font-size: 12.5px; }
  .missed-item .q { color: var(--text); margin-bottom: 4px; }
  .missed-item .meta { color: var(--muted); }

  .gauge-wrap { display: flex; align-items: baseline; gap: 14px; margin-top: 4px; }
  .gauge-num { font-size: 30px; font-weight: 700; color: var(--wire); }
  .gauge-bar { flex: 1; height: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .gauge-fill { height: 100%; background: linear-gradient(90deg, var(--focus), var(--building) 55%, var(--ready) 85%); }
  .gap-line { display: flex; justify-content: space-between; font-size: 12.5px; padding: 6px 0; border-top: 1px solid var(--line); }
  .gap-line:first-of-type { border-top: none; }
  .log-entry { font-size: 12.5px; padding: 3px 0; }
  .log-entry .tag { color: var(--dim); }

  .readiness-grid { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 4px; }
  .readiness-metric { flex: 1 1 140px; }
  .readiness-metric .num { font-size: 26px; font-weight: 700; color: var(--wire); }
  .readiness-metric .num.dim-num { color: var(--dim); font-size: 16px; }
  .readiness-metric .lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .readiness-metric .subnote { font-size: 10.5px; color: var(--dim); margin-top: 2px; }

  .hist-row { display: flex; justify-content: space-between; font-size: 12.5px; padding: 8px 0; border-top: 1px solid var(--line); }
  .hist-row:first-child { border-top: none; }
  .hist-date { color: var(--muted); width: 140px; flex-shrink: 0; }
  .hist-topic { flex: 1; color: var(--text); }
  .hist-score { width: 130px; text-align: right; }

  .toggle-row { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 12.5px; color: var(--muted); }
  .toggle-row input { accent-color: var(--wire); }

  .tutor-progress-bar { height: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .tutor-progress-fill { height: 100%; background: var(--wire); }
  .tutor-report { font-size: 13px; line-height: 1.7; margin-top: 14px; white-space: pre-wrap; }
  .tutor-report-meta { font-size: 11px; color: var(--dim); margin-top: 10px; }

  #loginGate { display: none; }

  @media (max-width: 560px) {
    .frame { margin: 0; border-radius: 0; border: none; }
    .cli-trend { display: none; }
    .content { padding: 18px 16px 24px; }
  }
</style>
</head>
<body>

<div class="frame">
  <div class="titlebar">
    <div class="dots"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span></div>
    <span class="path">guest@ccna-sim: ~</span>
    <div class="quota-ring-wrap" id="quotaRingWrap" title="Estimated daily Gemini quota remaining (self-tracked by this app, resets ~midnight UTC)">
      <div class="quota-ring-label"><span class="n" id="quotaPctText">--%</span><br>quota left</div>
      <div class="quota-ring">
        <svg width="30" height="30" viewBox="0 0 30 30">
          <circle class="track" cx="15" cy="15" r="12" stroke-width="3"></circle>
          <circle class="fill" id="quotaRingFill" cx="15" cy="15" r="12" stroke-width="3"
                  stroke="#4FBE85" stroke-dasharray="75.4" stroke-dashoffset="0"
                  transform="rotate(-90 15 15)"></circle>
        </svg>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="ghost-btn" id="journeyBtn">agent --report --journey</button>
    <button class="ghost-btn" id="tutorBtn">tutor --status</button>
    <button class="ghost-btn" id="historyBtn">show exam-history</button>
  </div>

  <div class="content">
    <div id="journeyPanel" class="box" style="display:none;"></div>
    <div id="tutorPanel" class="box" style="display:none;"></div>
    <div id="historyPanel" class="box" style="display:none;"></div>

    <p><span class="prompt">$</span> generate-exam --configure<span class="cursor"></span></p>
    <div class="box">
      <div class="section-title">--domain</div>
      <div class="flag-group" id="topicFlags">
        <div class="flag selected" data-value="All Domains (Full Exam)">all</div>
        <div class="flag" data-value="1.0 Network Fundamentals">1.0 fundamentals</div>
        <div class="flag" data-value="2.0 Network Access">2.0 access</div>
        <div class="flag" data-value="3.0 IP Connectivity">3.0 connectivity</div>
        <div class="flag" data-value="4.0 IP Services">4.0 services</div>
        <div class="flag" data-value="5.0 Security Fundamentals">5.0 security</div>
        <div class="flag" data-value="6.0 Automation & Programmability">6.0 automation</div>
      </div>

      <div class="field">
        <div class="section-title">--topic (optional, more specific than --domain)</div>
        <div class="topic-search-wrap">
          <input type="text" class="topic-search-input" id="topicSearchInput" placeholder="search e.g. OSPF, VLANs, ACLs, NAT, subnetting...">
          <div class="topic-suggestions" id="topicSuggestions"></div>
        </div>
        <div class="topic-chips" id="topicChips"></div>
      </div>

      <div class="field">
        <div class="section-title">--count</div>
        <div class="flag-group" id="countFlags">
          <div class="flag" data-value="1">1</div>
          <div class="flag" data-value="5">5</div>
          <div class="flag selected" data-value="20">20</div>
          <div class="flag" data-value="50">50</div>
          <div class="flag" data-value="100">100</div>
        </div>
      </div>

      <div id="focusBanner" class="focus-banner" style="display:none;">
        <span id="focusBannerText"></span>
        <button class="small-btn" id="clearFocusBtn">clear</button>
      </div>

      <button class="run-btn" id="generateBtn">run exam</button>
    </div>

    <div id="status" class="muted" style="margin-top: 14px;"></div>
    <div id="statusLine"></div>
    <div id="output"></div>

    <div class="toggle-row" id="reviewToggleRow" style="display:none;">
      <input type="checkbox" id="reviewOnlyToggle">
      <label for="reviewOnlyToggle">show missed questions only</label>
    </div>

    <div id="submitWrap"></div>
  </div>
</div>

<script>
const CCNA_TOPICS = [
  { label: "OSI and TCP/IP models", domain: "1.0 Network Fundamentals" },
  { label: "IPv4 addressing and subnetting", domain: "1.0 Network Fundamentals" },
  { label: "IPv6 addressing", domain: "1.0 Network Fundamentals" },
  { label: "Network topology architectures", domain: "1.0 Network Fundamentals" },
  { label: "Physical interfaces and cabling", domain: "1.0 Network Fundamentals" },
  { label: "Wireless principles", domain: "1.0 Network Fundamentals" },
  { label: "Virtualization fundamentals (VMs/containers)", domain: "1.0 Network Fundamentals" },
  { label: "Switching concepts (MAC table, frame forwarding)", domain: "1.0 Network Fundamentals" },
  { label: "VLANs and inter-VLAN routing", domain: "2.0 Network Access" },
  { label: "Trunking (802.1Q)", domain: "2.0 Network Access" },
  { label: "EtherChannel (LACP/PAgP)", domain: "2.0 Network Access" },
  { label: "Spanning Tree Protocol (STP/RSTP)", domain: "2.0 Network Access" },
  { label: "Wireless LAN architectures", domain: "2.0 Network Access" },
  { label: "WLC and AP management", domain: "2.0 Network Access" },
  { label: "Routing table components", domain: "3.0 IP Connectivity" },
  { label: "Router forwarding decisions", domain: "3.0 IP Connectivity" },
  { label: "Static routing (IPv4/IPv6)", domain: "3.0 IP Connectivity" },
  { label: "OSPFv2 single area", domain: "3.0 IP Connectivity" },
  { label: "First hop redundancy (HSRP)", domain: "3.0 IP Connectivity" },
  { label: "NAT/PAT", domain: "4.0 IP Services" },
  { label: "DHCP and DNS", domain: "4.0 IP Services" },
  { label: "NTP", domain: "4.0 IP Services" },
  { label: "SNMP and Syslog", domain: "4.0 IP Services" },
  { label: "QoS concepts", domain: "4.0 IP Services" },
  { label: "TFTP/FTP file transfer", domain: "4.0 IP Services" },
  { label: "Security concepts (threats, vulnerabilities)", domain: "5.0 Security Fundamentals" },
  { label: "Access Control Lists (standard/extended)", domain: "5.0 Security Fundamentals" },
  { label: "Layer 2 security (port security, DHCP snooping)", domain: "5.0 Security Fundamentals" },
  { label: "Wireless security (WPA2/WPA3)", domain: "5.0 Security Fundamentals" },
  { label: "Remote access VPN", domain: "5.0 Security Fundamentals" },
  { label: "AAA concepts", domain: "5.0 Security Fundamentals" },
  { label: "Device hardening and passwords/MFA", domain: "5.0 Security Fundamentals" },
  { label: "Impact of automation on networking", domain: "6.0 Automation & Programmability" },
  { label: "Controller-based vs traditional networking", domain: "6.0 Automation & Programmability" },
  { label: "REST API characteristics", domain: "6.0 Automation & Programmability" },
  { label: "JSON data encoding", domain: "6.0 Automation & Programmability" },
  { label: "Configuration management tools (Puppet/Chef/Ansible)", domain: "6.0 Automation & Programmability" },
];

let selectedTopicSearchItems = [];

function renderTopicChips() {
  const chipsEl = document.getElementById('topicChips');
  chipsEl.innerHTML = selectedTopicSearchItems.map((label, i) => `
    <span class="topic-chip">${escapeHtml(label)}<button data-i="${i}">×</button></span>
  `).join('');
  chipsEl.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedTopicSearchItems.splice(parseInt(btn.dataset.i), 1);
      renderTopicChips();
    });
  });
}

const topicSearchInput = document.getElementById('topicSearchInput');
const topicSuggestions = document.getElementById('topicSuggestions');

topicSearchInput.addEventListener('input', () => {
  const q = topicSearchInput.value.trim().toLowerCase();
  if (!q) { topicSuggestions.classList.remove('open'); return; }
  const matches = CCNA_TOPICS.filter(t =>
    t.label.toLowerCase().includes(q) && !selectedTopicSearchItems.includes(t.label)
  ).slice(0, 8);
  if (!matches.length) { topicSuggestions.classList.remove('open'); return; }
  topicSuggestions.innerHTML = matches.map(t => `
    <div class="topic-suggestion" data-label="${escapeHtml(t.label)}">
      <span>${escapeHtml(t.label)}</span><span class="dom">${escapeHtml(t.domain.split(' ')[0])}</span>
    </div>
  `).join('');
  topicSuggestions.classList.add('open');
});

topicSuggestions.addEventListener('click', (e) => {
  const item = e.target.closest('.topic-suggestion');
  if (!item) return;
  const label = item.dataset.label;
  if (!selectedTopicSearchItems.includes(label)) selectedTopicSearchItems.push(label);
  topicSearchInput.value = '';
  topicSuggestions.classList.remove('open');
  renderTopicChips();
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.topic-search-wrap')) topicSuggestions.classList.remove('open');
});

const QUOTA_CIRCUMFERENCE = 2 * Math.PI * 12;

async function refreshQuotaRing() {
  try {
    const res = await fetch('/quota-status');
    const data = await res.json();
    if (data.error) return;
    const pct = data.remaining_pct;
    document.getElementById('quotaPctText').textContent = `${pct}%`;
    const fill = document.getElementById('quotaRingFill');
    fill.setAttribute('stroke-dashoffset', QUOTA_CIRCUMFERENCE * (1 - pct / 100));
    const color = pct >= 50 ? '#4FBE85' : (pct >= 20 ? '#E0AC4E' : '#E06868');
    fill.setAttribute('stroke', color);
    document.getElementById('quotaRingWrap').title =
      `Estimated: ${data.used}/${data.limit} Gemini requests used today (self-tracked by this app, resets ~midnight UTC)`;
  } catch (err) {
    // Non-critical - fail silently, ring just stays at its last known state.
  }
}
refreshQuotaRing();

let currentQuestions = [];
let selectedTopic = "All Domains (Full Exam)";
let selectedCount = 20;
let pendingFocusDomains = [];
let examSubmitted = false;

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function statusClass(status) {
  return status === 'READY' ? 'ready-txt' : (status === 'BUILDING' ? 'building-txt' : 'focus-txt');
}
function trendHtml(trend) {
  if (trend === null || trend === undefined) return '<span class="cli-trend none">—</span>';
  if (trend > 0) return `<span class="cli-trend up">▲ +${trend}</span>`;
  if (trend < 0) return `<span class="cli-trend down">▼ ${trend}</span>`;
  return '<span class="cli-trend flat">▬ 0</span>';
}
function domainRowsToHtml(rows) {
  return rows.map(r => `
    <div class="cli-row">
      <span class="cli-id">${escapeHtml(r.id)}</span>
      <span class="cli-name">${escapeHtml(r.domain.replace(/^[0-9.]+\s*/, ''))}</span>
      <span class="cli-pct">${r.pct}%</span>
      ${trendHtml(r.trend)}
      <span class="cli-status ${statusClass(r.status)}">${r.status}</span>
    </div>
  `).join('');
}
function renderJourneyPanel(journey, report) {
  const panel = document.getElementById('journeyPanel');
  if (!journey) {
    panel.innerHTML = `<p class="muted">${escapeHtml(report || 'No exam history yet.')}</p>`;
    return;
  }
  const gapHtml = journey.gap_ranking.map(g => `
    <div class="gap-line">
      <span>${escapeHtml(g.id)} ${escapeHtml(g.domain.replace(/^[0-9.]+\s*/, ''))} <span class="dim">(${g.weight}% of exam)</span></span>
      <span class="muted">close ${g.gap_points}pt gap</span>
    </div>
  `).join('');

  const conceptGapHtml = (journey.concept_gaps || []).map(c => `
    <div class="gap-line">
      <span>${escapeHtml(c.concept)} <span class="dim">(${c.attempts} attempts, ${c.pct}%)</span></span>
      <span class="muted">${escapeHtml(_domain_short(c.domain))}</span>
    </div>
  `).join('');

  const logHtml = journey.log.map(l => `<div class="log-entry"><span class="tag">[${escapeHtml(l.when)}]</span> ${escapeHtml(l.text)}</div>`).join('');

  const recentHtml = journey.readiness_recent !== null
    ? `<div class="num">${journey.readiness_recent}%</div><div class="lbl">last ${journey.readiness_recent_sessions} sessions</div>`
    : `<div class="num dim-num">--</div><div class="lbl">last 5 sessions</div><div class="subnote">need more sessions</div>`;

  const predictedHtml = journey.readiness_predicted !== null
    ? `<div class="num">${journey.readiness_predicted}%</div><div class="lbl">predicted exam score</div><div class="subnote">weighted by real exam %, ${journey.readiness_predicted_coverage} domains</div>`
    : `<div class="num dim-num">--</div><div class="lbl">predicted exam score</div><div class="subnote">need 5+ answers per domain</div>`;

  // Prefer specific concept-level focus over broad domain focus, when we have enough data.
  const useConceptFocus = (journey.suggested_focus_concepts || []).length > 0;
  const focusLabel = useConceptFocus
    ? journey.suggested_focus_concepts.join(', ')
    : journey.suggested_focus_domains.map(d => 'D' + d.split(' ')[0].replace('.0','')).join(', ');

  panel.innerHTML = `
    <div class="section-title">readiness — three ways to read it</div>
    <div class="readiness-grid">
      <div class="readiness-metric">
        <div class="num">${journey.readiness}%</div>
        <div class="lbl">lifetime average</div>
        <div class="subnote">${journey.sessions_counted} session(s) total</div>
      </div>
      <div class="readiness-metric">${recentHtml}</div>
      <div class="readiness-metric">${predictedHtml}</div>
    </div>

    <div class="section-title" style="margin-top:22px;">fastest path to 100% — by domain (gap × exam weight)</div>
    ${gapHtml || '<p class="muted">Not enough data yet.</p>'}

    <div class="section-title" style="margin-top:20px;">specific weak spots — by concept</div>
    ${conceptGapHtml || '<p class="muted">Not enough repeated data on any one concept yet — answer a few more questions per topic and this will fill in.</p>'}

    <div class="section-title" style="margin-top:20px;">session log</div>
    ${logHtml || '<p class="muted">No sessions logged yet.</p>'}

    <p style="font-size:12.5px; margin-top:16px; line-height:1.7;">${escapeHtml(report)}</p>

    ${focusLabel ? `<button class="run-btn alt" id="buildFocusBtn">build focus exam — ${escapeHtml(focusLabel)}</button>` : ''}
  `;

  const focusBtn = document.getElementById('buildFocusBtn');
  if (focusBtn) {
    focusBtn.addEventListener('click', () => {
      if (useConceptFocus) {
        selectedTopicSearchItems = journey.suggested_focus_concepts.slice();
        renderTopicChips();
        document.getElementById('focusBannerText').textContent =
          `focus mode: ${selectedTopicSearchItems.join(', ')} (specific concepts, from your history)`;
      } else {
        pendingFocusDomains = journey.suggested_focus_domains;
        document.getElementById('focusBannerText').textContent =
          `focus mode: ${pendingFocusDomains.map(d => d.split(' ')[0]).join(', ')} (60% of next exam)`;
      }
      document.getElementById('focusBanner').style.display = 'flex';
      panel.style.display = 'none';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }
}

function _domain_short(domain) {
  if (!domain) return '';
  return 'D' + domain.split(' ')[0].replace('.0', '');
}

async function fetchJourney() {
  const panel = document.getElementById('journeyPanel');
  const wasOpen = panel.style.display === 'block';
  document.getElementById('historyPanel').style.display = 'none';
  document.getElementById('tutorPanel').style.display = 'none';
  if (wasOpen) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  panel.innerHTML = '<p class="muted">Analyzing your session history...</p>';
  try {
    const res = await fetch('/ai-progress-agent');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderJourneyPanel(data.journey, data.report);
    refreshQuotaRing();
  } catch (err) {
    panel.innerHTML = `<p class="muted">Error: ${escapeHtml(err.message)}</p>`;
  }
}

function renderTutorPanel(progress, report, questionsCovered) {
  const panel = document.getElementById('tutorPanel');
  if (report) {
    panel.innerHTML = `
      <div class="section-title">tutor session — ${questionsCovered} questions covered</div>
      <div class="tutor-report">${escapeHtml(report)}</div>
      <div class="tutor-report-meta">Next tutor session unlocks after ${progress.threshold} more questions.</div>
    `;
    return;
  }
  const pct = Math.min(100, Math.round((progress.questions_since_last_tutor / progress.threshold) * 100));
  if (progress.unlocked) {
    panel.innerHTML = `
      <div class="section-title">tutor session available</div>
      <p style="font-size:12.5px;">You've answered ${progress.questions_since_last_tutor} questions since your last tutor session — enough for a proper deep-dive grounded in your actual missed questions.</p>
      <button class="run-btn alt" id="requestTutorBtn">request tutor session</button>
    `;
    document.getElementById('requestTutorBtn').addEventListener('click', requestTutorSession);
  } else {
    panel.innerHTML = `
      <div class="section-title">tutor session — locked</div>
      <p style="font-size:12.5px;" class="muted">${progress.questions_since_last_tutor} / ${progress.threshold} questions answered since last session.</p>
      <div class="tutor-progress-bar"><div class="tutor-progress-fill" style="width:${pct}%"></div></div>
      <p style="font-size:11.5px; margin-top:10px;" class="dim">Answer ${progress.threshold - progress.questions_since_last_tutor} more question(s) to unlock a tutor session — it'll use everything you've missed since the last one to explain the concepts properly, in one focused sitting.</p>
    `;
  }
}

async function toggleTutor() {
  const panel = document.getElementById('tutorPanel');
  const wasOpen = panel.style.display === 'block';
  document.getElementById('journeyPanel').style.display = 'none';
  document.getElementById('historyPanel').style.display = 'none';
  if (wasOpen) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  panel.innerHTML = '<p class="muted">Checking tutor status...</p>';
  try {
    const res = await fetch('/tutor-status');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderTutorPanel(data, null, null);
  } catch (err) {
    panel.innerHTML = `<p class="muted">Error: ${escapeHtml(err.message)}</p>`;
  }
}

async function requestTutorSession() {
  const panel = document.getElementById('tutorPanel');
  const btn = document.getElementById('requestTutorBtn');
  setButtonLoading(btn, true, 'thinking...', 'request tutor session');
  try {
    const res = await fetch('/tutor-session', { method: 'POST' });
    const data = await res.json();
    if (data.error) {
      if (data.progress) { renderTutorPanel(data.progress, null, null); }
      panel.insertAdjacentHTML('afterbegin', `<p class="muted">${escapeHtml(data.error)}</p>`);
      refreshQuotaRing();
      return;
    }
    renderTutorPanel(data.progress, data.report, data.progress.lifetime_total);
    refreshQuotaRing();
  } catch (err) {
    panel.innerHTML = `<p class="muted">Error: ${escapeHtml(err.message)}</p>`;
  }
}

async function toggleHistory() {
  const panel = document.getElementById('historyPanel');
  document.getElementById('journeyPanel').style.display = 'none';
  document.getElementById('tutorPanel').style.display = 'none';
  if (panel.style.display === 'block') { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  panel.innerHTML = '<p class="muted">Loading history...</p>';
  try {
    const res = await fetch('/history');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    if (!data.length) { panel.innerHTML = '<p class="muted">No past exam attempts yet.</p>'; return; }
    panel.innerHTML = `<div class="section-title">show exam-history --last 15</div>` + data.map(s => `
      <div class="hist-row">
        <span class="hist-date">${escapeHtml(s.timestamp)}</span>
        <span class="hist-topic">${escapeHtml(s.topic)}</span>
        <span class="hist-score ${s.status === 'PASSED' ? 'ready-txt' : 'focus-txt'}">${s.percentage}% ${s.status}</span>
      </div>
    `).join('');
  } catch (err) {
    panel.innerHTML = `<p class="muted">Error: ${escapeHtml(err.message)}</p>`;
  }
}

document.getElementById('journeyBtn').addEventListener('click', fetchJourney);
document.getElementById('tutorBtn').addEventListener('click', toggleTutor);
document.getElementById('historyBtn').addEventListener('click', toggleHistory);
document.getElementById('clearFocusBtn').addEventListener('click', () => {
  pendingFocusDomains = [];
  selectedTopicSearchItems = [];
  renderTopicChips();
  document.getElementById('focusBanner').style.display = 'none';
});

document.querySelectorAll('#topicFlags .flag').forEach(f => {
  f.addEventListener('click', () => {
    document.querySelectorAll('#topicFlags .flag').forEach(x => x.classList.remove('selected'));
    f.classList.add('selected');
    selectedTopic = f.dataset.value;
  });
});
document.querySelectorAll('#countFlags .flag').forEach(f => {
  f.addEventListener('click', () => {
    document.querySelectorAll('#countFlags .flag').forEach(x => x.classList.remove('selected'));
    f.classList.add('selected');
    selectedCount = parseInt(f.dataset.value);
  });
});

function setButtonLoading(btn, isLoading, loadingText, defaultText) {
  btn.disabled = isLoading;
  btn.textContent = isLoading ? loadingText : defaultText;
}

async function generateExam() {
  const status = document.getElementById('status');
  const output = document.getElementById('output');
  const statusLine = document.getElementById('statusLine');
  const reviewToggleRow = document.getElementById('reviewToggleRow');
  const submitWrap = document.getElementById('submitWrap');
  const genBtn = document.getElementById('generateBtn');

  statusLine.innerHTML = '';
  reviewToggleRow.style.display = 'none';
  submitWrap.innerHTML = '';
  examSubmitted = false;
  output.innerHTML = '';
  status.textContent = `Generating ${selectedCount} CCNA question(s)... this can take a little while for larger exams.`;
  setButtonLoading(genBtn, true, 'generating...', 'run exam');

  try {
    const res = await fetch('/generate-exam', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: selectedTopic, count: selectedCount, focus_domains: pendingFocusDomains, focus_topics: selectedTopicSearchItems })
    });
    currentQuestions = await res.json();
    if (currentQuestions.error) throw new Error(currentQuestions.error);
    if (!Array.isArray(currentQuestions) || currentQuestions.length === 0) {
      throw new Error('No questions were generated. Please try again.');
    }

    status.textContent = `Exam loaded: ${currentQuestions.length} question(s). Use prev/next to move through them, then submit.`;

    currentQuestionIndex = 0;
    const cardsHtml = currentQuestions.map((q, idx) => `
      <div class="q-card" id="card_${idx}">
        <div class="q-head"><span>question ${String(idx + 1).padStart(2,'0')} / ${currentQuestions.length}</span><span>${escapeHtml(q.domain || '')}</span></div>
        <div class="q-text">${escapeHtml(q.question)}</div>
        ${q.options.map(opt => `
          <label class="option">
            <input type="radio" name="q_${idx}" value="${escapeHtml(opt.charAt(0))}">
            <span class="letter">${escapeHtml(opt.charAt(0))}</span>
            <span>${escapeHtml(opt.slice(opt.indexOf('.') + 1).trim())}</span>
          </label>
        `).join('')}
        <div id="expl_${idx}" class="explanation">
          <strong>Correct answer: ${escapeHtml(q.answer)}</strong>
          <p style="margin:6px 0 0;">${escapeHtml(q.explanation)}</p>
        </div>
      </div>
    `).join('');

    output.innerHTML = `
      <div class="exam-nav">
        <button class="ghost-btn" id="prevQBtn">‹ prev</button>
        <span class="exam-position" id="examPosition"></span>
        <button class="ghost-btn" id="nextQBtn">next ›</button>
      </div>
      <div class="exam-viewport">
        <div class="exam-track" id="examTrack">${cardsHtml}</div>
      </div>
    `;

    document.getElementById('prevQBtn').addEventListener('click', () => {
      if (currentQuestionIndex > 0) { currentQuestionIndex--; updateExamNav(); }
    });
    document.getElementById('nextQBtn').addEventListener('click', () => {
      if (currentQuestionIndex < currentQuestions.length - 1) { currentQuestionIndex++; updateExamNav(); }
    });
    updateExamNav();

    submitWrap.innerHTML = `<button class="run-btn" id="submitBtn">submit final exam</button>`;
    document.getElementById('submitBtn').addEventListener('click', submitExam);

    if (pendingFocusDomains.length) {
      pendingFocusDomains = [];
      document.getElementById('focusBanner').style.display = 'none';
    }
  } catch (err) {
    status.textContent = 'Error: ' + err.message;
  } finally {
    setButtonLoading(genBtn, false, '', 'run exam');
    refreshQuotaRing();
  }
}
document.getElementById('generateBtn').addEventListener('click', generateExam);

function countUnanswered() {
  let n = 0;
  currentQuestions.forEach((q, idx) => { if (!document.querySelector(`input[name="q_${idx}"]:checked`)) n++; });
  return n;
}

async function submitExam() {
  const submitBtn = document.getElementById('submitBtn');
  const unanswered = countUnanswered();
  if (unanswered > 0 && !submitExam._confirmed) {
    submitExam._confirmed = true;
    document.getElementById('status').textContent = `${unanswered} unanswered question(s). Click submit again to submit anyway.`;
    return;
  }
  submitExam._confirmed = false;
  setButtonLoading(submitBtn, true, 'submitting...', 'submit final exam');

  let correctCount = 0;
  const totalQuestions = currentQuestions.length;
  const missedQuestionsList = [];
  const domainStats = {};
  const conceptStats = {};

  currentQuestions.forEach((q, idx) => {
    const selected = document.querySelector(`input[name="q_${idx}"]:checked`);
    document.getElementById(`expl_${idx}`).style.display = 'block';
    const cardEl = document.getElementById(`card_${idx}`);
    const userAnswer = selected ? selected.value.trim().toUpperCase() : 'NONE';
    const correctAnswer = q.answer.trim().charAt(0).toUpperCase();
    const domain = q.domain || 'Unspecified';
    const concept = q.concept || null;

    if (!domainStats[domain]) domainStats[domain] = { correct: 0, total: 0 };
    domainStats[domain].total++;
    if (concept) {
      if (!conceptStats[concept]) conceptStats[concept] = { correct: 0, total: 0, domain };
      conceptStats[concept].total++;
    }

    if (userAnswer === correctAnswer) {
      correctCount++;
      domainStats[domain].correct++;
      if (concept) conceptStats[concept].correct++;
      cardEl.classList.add('correct');
      cardEl.dataset.missed = 'false';
    } else {
      missedQuestionsList.push({ question: q.question, domain, concept, user_answered: userAnswer, correct_answer: correctAnswer, explanation: q.explanation });
      cardEl.classList.add('missed');
      cardEl.dataset.missed = 'true';
    }
  });

  const percentage = parseFloat(((correctCount / totalQuestions) * 100).toFixed(2));
  const passed = percentage >= 85.0;
  const statusLine = document.getElementById('statusLine');
  statusLine.innerHTML = `
    <div class="status-line ${passed ? 'pass' : 'fail'}">
      <span>exit code: ${passed ? 'PASS' : 'FAIL'}</span>
      <span class="big">${percentage}% · ${correctCount}/${totalQuestions} correct</span>
    </div>`;

  document.getElementById('reviewToggleRow').style.display = missedQuestionsList.length ? 'flex' : 'none';
  document.getElementById('reviewOnlyToggle').checked = false;
  submitBtn.style.display = 'none';
  examSubmitted = true;
  window.scrollTo({ top: 0, behavior: 'smooth' });

  try {
    const res = await fetch('/save-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: selectedTopic, score: correctCount, total: totalQuestions, missed_questions: missedQuestionsList, domain_stats: domainStats, concept_stats: conceptStats })
    });
    const data = await res.json();
    if (data.journey) {
      const box = document.createElement('div');
      box.className = 'box';
      box.innerHTML = `<div class="section-title">! show ccna domain-status</div>${domainRowsToHtml(data.journey.domain_rows)}`;
      statusLine.appendChild(box);
    }
    if (missedQuestionsList.length) {
      const missedBox = document.createElement('div');
      missedBox.className = 'box';
      missedBox.innerHTML = `<div class="section-title">missed questions — review</div>` + missedQuestionsList.map(m => `
        <div class="missed-item">
          <div class="q">"${escapeHtml(m.question)}"</div>
          <div class="meta">you answered ${escapeHtml(m.user_answered)} · correct answer ${escapeHtml(m.correct_answer)} · ${escapeHtml(m.domain)}</div>
        </div>
      `).join('');
      statusLine.appendChild(missedBox);
    }
  } catch (err) {
    console.error('Failed to save session:', err);
  }
}

document.getElementById('reviewOnlyToggle').addEventListener('change', (e) => {
  const onlyMissed = e.target.checked;
  currentQuestions.forEach((q, idx) => {
    const cardEl = document.getElementById(`card_${idx}`);
    if (!cardEl) return;
    cardEl.style.display = (onlyMissed && cardEl.dataset.missed !== 'true') ? 'none' : '';
  });
});
</script>

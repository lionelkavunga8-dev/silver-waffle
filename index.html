<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCNA 200-301 Practice Generator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 30px auto; padding: 20px; background: #f4f6f9; color: #333; }
        .container { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        select, button { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 15px; }
        button { background: #0070ad; color: #fff; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #005073; }
        .card { border-left: 5px solid #0070ad; background: #fafafa; padding: 15px; margin-top: 20px; border-radius: 4px; }
        .option-item { margin-bottom: 8px; }
        .feedback { display: none; padding: 12px; margin-top: 12px; border-radius: 4px; font-size: 14px; }
        .feedback.correct { background: #e8f5e9; border-left: 4px solid #2e7d32; color: #1b5e20; }
        .feedback.incorrect { background: #ffebee; border-left: 4px solid #c62828; color: #b71c1c; }
        .q-number { font-weight: bold; color: #0070ad; margin-bottom: 5px; }
        .check-btn { width: auto; padding: 6px 14px; background: #333; font-size: 14px; }
        .check-btn:hover { background: #555; }
    </style>
</head>
<body>

<div class="container">
    <h2>CCNA 200-301 Practice Generator</h2>

    <div class="form-group">
        <label for="topic">Select CCNA Domain:</label>
        <select id="topic">
            <option value="All Domains (Full Exam)">All Domains (Mixed Comprehensive)</option>
            <option value="1.0 Network Fundamentals (20%)">1.0 Network Fundamentals (20%)</option>
            <option value="2.0 Network Access (20%)">2.0 Network Access (20%)</option>
            <option value="3.0 IP Connectivity (25%)">3.0 IP Connectivity (25%)</option>
            <option value="4.0 IP Services (10%)">4.0 IP Services (10%)</option>
            <option value="5.0 Security Fundamentals (15%)">5.0 Security Fundamentals (15%)</option>
            <option value="6.0 Automation & Programmability (10%)">6.0 Automation & Programmability (10%)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="count">Number of Questions:</label>
        <select id="count">
            <option value="1">1 Question (Quick Practice)</option>
            <option value="5">5 Questions</option>
            <option value="20">20 Questions (Domain Quiz)</option>
            <option value="50">50 Questions (Half-Length Practice Exam)</option>
        </select>
    </div>

    <button onclick="generateExam()">Generate Practice Exam</button>
    
    <div id="status" style="margin-top: 15px; font-weight: bold; color: #555;"></div>
    <div id="output"></div>
</div>

<script>
let currentQuestions = [];

async function generateExam() {
    const topic = document.getElementById('topic').value;
    const count = parseInt(document.getElementById('count').value);
    const status = document.getElementById('status');
    const output = document.getElementById('output');

    status.innerText = `Generating ${count} CCNA question(s)... Please wait.`;
    output.innerHTML = "";

    try {
        const res = await fetch('/generate-exam', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ topic: topic, count: count })
        });

        currentQuestions = await res.json();
        if (currentQuestions.error) throw new Error(currentQuestions.error);

        status.innerText = `Generated ${currentQuestions.length} Question(s):`;

        output.innerHTML = currentQuestions.map((q, idx) => `
            <div class="card" id="card_${idx}">
                <div class="q-number">Question ${idx + 1}</div>
                <p><strong>${q.question}</strong></p>
                ${q.options.map((opt, optIdx) => `
                    <div class="option-item">
                        <label style="font-weight: normal; cursor: pointer;">
                            <input type="radio" name="q_${idx}" value="${opt.charAt(0)}"> ${opt}
                        </label>
                    </div>
                `).join('')}
                <button class="check-btn" onclick="checkAnswer(${idx})">Submit Answer</button>
                <div id="feedback_${idx}" class="feedback"></div>
            </div>
        `).join('');

    } catch (err) {
        status.innerText = "Error: " + err.message;
    }
}

function checkAnswer(idx) {
    const selectedOption = document.querySelector(`input[name="q_${idx}"]:checked`);
    const feedbackBox = document.getElementById(`feedback_${idx}`);
    const questionData = currentQuestions[idx];

    if (!selectedOption) {
        alert("Please select an answer before submitting.");
        return;
    }

    const userAnswer = selectedOption.value.trim().toUpperCase();
    const correctAnswer = questionData.answer.trim().charAt(0).toUpperCase();

    feedbackBox.style.display = "block";

    if (userAnswer === correctAnswer) {
        feedbackBox.className = "feedback correct";
        feedbackBox.innerHTML = `
            <strong>Correct! (Selected: ${userAnswer})</strong>
            <p>${questionData.explanation}</p>
        `;
    } else {
        feedbackBox.className = "feedback incorrect";
        feedbackBox.innerHTML = `
            <strong>Incorrect. You selected ${userAnswer}, but the correct answer is ${correctAnswer}.</strong>
            <p>${questionData.explanation}</p>
        `;
    }
}
</script>

</body>
</html>

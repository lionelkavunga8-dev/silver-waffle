<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CCNA Exam Simulator</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; color: #333; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .login-box { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 340px; }
        h2 { margin-top: 0; text-align: center; }
        input, button { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; font-size: 15px; box-sizing: border-box; }
        button { background: #0070ad; color: #fff; border: none; cursor: pointer; font-weight: bold; margin-top: 12px; }
        button:hover { background: #005073; }
        .error { color: #c62828; font-size: 14px; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 CCNA Exam Simulator</h2>
        <form method="POST" action="/login">
            <input type="password" name="password" placeholder="Enter password" autofocus required>
            <button type="submit">Enter</button>
        </form>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
    </div>
</body>
</html>
